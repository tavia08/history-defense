<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>역사디펜스 | 내 기록</title><link rel="stylesheet" href="assets/hd-records.css"><style>body{margin:0;min-height:100vh;background:linear-gradient(145deg,#21170f,#432e21);color:#f6e3c5;font:16px 'Malgun Gothic',sans-serif}main{max-width:840px;margin:0 auto;padding:30px 16px}a{color:#ffe1a3}h1{color:#ffdea0}select{padding:10px;background:#fff5e4;color:#261b14;border-radius:8px}table{width:100%;border-collapse:collapse;background:#2e2118;border:1px solid #b68d58}th,td{padding:13px;border-bottom:1px solid #6d5138;text-align:left}th{color:#f6d08d}p{line-height:1.7}.note{background:#473425;border-left:4px solid #ffd089;padding:12px;border-radius:7px}button{padding:10px;background:#65482c;color:#ffebca;border:1px solid #ba9666;border-radius:8px;cursor:pointer}</style></head><body><main><a href="index.html">← 전투 지휘소</a><h1>🏆 역사 디펜스 명예의 전당</h1><p class="note" id="lbStatus"><b>현재는 로컬 시험판입니다.</b> 공동 랭킹은 교사가 서버 주소를 설정한 뒤 활성화됩니다.</p><p><button id="refreshRanks" type="button">공동 순위 새로고침</button> <span id="lastUpdated" style="font-size:12px;color:#e6c993" role="status"></span></p><p><label>스테이지 선택 <select id="stage"><option value="ansi">안시성 전투</option><option value="cheonmun">천문령 전투</option><option value="gwiju">귀주대첩</option><option value="hansan">한산도 대첩</option></select></label></p><table><thead><tr><th>순위</th><th>반</th><th>이니셜</th><th>점수</th><th>최고 웨이브</th></tr></thead><tbody id="records"></tbody></table><p id="empty" hidden>등록된 기록이 없습니다.</p><p style="font-size:13px;opacity:.8">학번·실명은 입력받지 않습니다. 공동 랭킹은 브라우저별 임시 ID를 사용합니다. 같은 학생의 다른 기기 기록은 별도로 등록될 수 있습니다.</p></main><script src="assets/hd-online-config.js"></script><script src="assets/hd-online.js"></script><script src="assets/hd-records.js"></script><script>
let requestNumber=0;
const $id=id=>document.getElementById(id);
function renderRows(rows){
  $id('records').replaceChildren();
  for(const [i,r] of rows.entries()){
    const tr=document.createElement('tr');
    for(const value of [i+1,`${r.cls}반`,r.initial,Number(r.score).toLocaleString('ko-KR'),r.wave]){
      const td=document.createElement('td');td.textContent=String(value);tr.append(td);
    }
    $id('records').append(tr);
  }
  $id('empty').hidden=rows.length>0;
}
async function show(){
  const req=++requestNumber, stage=$id('stage').value, online=!!(window.HDOnline?.isConfigured());
  $id('refreshRanks').disabled=true;
  $id('lastUpdated').textContent='조회 중…';
  $id('lbStatus').textContent=online?'구글시트 공동 TOP 50을 조회하고 있습니다.':'서버 미연결 · 이 브라우저의 시험 기록만 표시합니다.';
  try{
    if(!online){renderRows(HDRecords.list(stage));$id('lastUpdated').textContent='로컬 기록';return;}
    const data=await HDOnline.top(stage);
    if(req!==requestNumber)return;
    if(!data?.ok||!Array.isArray(data.rows))throw Error('BAD_RESPONSE');
    const rows=data.rows.filter(r=>Number.isInteger(Number(r.cls))&&Number(r.cls)>=1&&Number(r.cls)<=15&&/^[A-Z]{2,4}$/.test(String(r.initial))&&Number.isInteger(Number(r.score))&&Number(r.score)>=0&&Number(r.score)<=10000&&Number.isInteger(Number(r.wave))&&Number(r.wave)>=1&&Number(r.wave)<=5).sort((a,b)=>Number(b.score)-Number(a.score)).slice(0,50);
    renderRows(rows);
    $id('lbStatus').textContent='구글시트 공동 TOP 50 · 반과 이니셜만 공개됩니다. 게임 성적은 별도 인증되지 않은 참고용 점수입니다.';
    $id('lastUpdated').textContent=`온라인 조회 성공 · ${new Date().toLocaleTimeString('ko-KR')}`;
    $id('empty').textContent='이 스테이지의 공동 등록 기록이 아직 없습니다.';
  }catch(err){
    if(req!==requestNumber)return;
    renderRows([]);
    $id('lbStatus').textContent='공동 랭킹 조회에 실패했습니다. 로컬 기록을 공동 순위로 표시하지 않습니다.';
    $id('lastUpdated').textContent='조회 실패 · 다시 시도';
    $id('empty').textContent='온라인 기록을 불러오지 못했습니다. 연결을 확인하고 새로고침해 주세요.';
  }finally{if(req===requestNumber)$id('refreshRanks').disabled=false;}
}
$id('stage').addEventListener('change',show);
$id('refreshRanks').addEventListener('click',show);
show();
</script></body></html>
