<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>역사디펜스 | 내 기록</title><link rel="stylesheet" href="assets/hd-records.css"><style>body{margin:0;min-height:100vh;background:linear-gradient(145deg,#21170f,#432e21);color:#f6e3c5;font:16px 'Malgun Gothic',sans-serif}main{max-width:840px;margin:0 auto;padding:30px 16px}a{color:#ffe1a3}h1{color:#ffdea0}select{padding:10px;background:#fff5e4;color:#261b14;border-radius:8px}table{width:100%;border-collapse:collapse;background:#2e2118;border:1px solid #b68d58}th,td{padding:13px;border-bottom:1px solid #6d5138;text-align:left}th{color:#f6d08d}p{line-height:1.7}.note{background:#473425;border-left:4px solid #ffd089;padding:12px;border-radius:7px}button{padding:10px;background:#65482c;color:#ffebca;border:1px solid #ba9666;border-radius:8px;cursor:pointer}</style></head><body><main><a href="index.html">← 전투 지휘소</a><h1>🏆 내 기록 · 명예의 전당 준비판</h1><p class="note"><b>현재는 로컬 시험판입니다.</b> 이 기기의 브라우저에 저장한 기록만 보입니다. <b>전교 TOP 50이나 다른 학생의 점수는 아직 표시되지 않습니다.</b> 공동 랭킹은 Google Sheets 연결과 기록 검증 체계를 마련한 뒤 활성화합니다.</p><p><label>스테이지 선택 <select id="stage"><option value="ansi">안시성 전투</option><option value="cheonmun">천문령 전투</option><option value="gwiju">귀주대첩</option><option value="hansan">한산도 대첩</option></select></label></p><table><thead><tr><th>순위</th><th>반</th><th>이니셜</th><th>시험 점수</th><th>최고 웨이브</th></tr></thead><tbody id="records"></tbody></table><p id="empty" hidden>이 기기에 저장된 기록이 없습니다. 게임을 진행하고 기록을 등록해 보세요.</p><p style="font-size:13px;opacity:.8">학번·실명은 입력받지 않습니다. 동일한 반·이니셜을 한 사람으로 간주하는 임시 방식이므로 실제 학생별 최고 기록 관리에는 사용하지 않습니다.</p></main><script src="assets/hd-records.js"></script><script>function show(){let rows=HDRecords.list(document.getElementById('stage').value);document.getElementById('records').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.cls}반</td><td>${HDRecords.safe(r.initial)}</td><td>${r.score.toLocaleString()}</td><td>${r.wave}</td></tr>`).join('');document.getElementById('empty').hidden=rows.length>0;}document.getElementById('stage').addEventListener('change',show);show();</script></body></html>
