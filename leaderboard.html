<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>역사디펜스 | 내 기록</title><link rel="stylesheet" href="assets/hd-records.css"><style>body{margin:0;min-height:100vh;background:linear-gradient(145deg,#21170f,#432e21);color:#f6e3c5;font:16px 'Malgun Gothic',sans-serif}main{max-width:840px;margin:0 auto;padding:30px 16px}a{color:#ffe1a3}h1{color:#ffdea0}select{padding:10px;background:#fff5e4;color:#261b14;border-radius:8px}table{width:100%;border-collapse:collapse;background:#2e2118;border:1px solid #b68d58}th,td{padding:13px;border-bottom:1px solid #6d5138;text-align:left}th{color:#f6d08d}p{line-height:1.7}.note{background:#473425;border-left:4px solid #ffd089;padding:12px;border-radius:7px}button{padding:10px;background:#65482c;color:#ffebca;border:1px solid #ba9666;border-radius:8px;cursor:pointer}</style></head><body><main><a href="index.html">← 전투 지휘소</a><h1>🏆 역사 디펜스 명예의 전당</h1><p class="note" id="lbStatus"><b>현재는 로컬 시험판입니다.</b> 공동 랭킹은 교사가 서버 주소를 설정한 뒤 활성화됩니다.</p><p><button id="refreshRanks" type="button">순위 새로고침</button></p><p><label>스테이지 선택 <select id="stage"><option value="ansi">안시성 전투</option><option value="cheonmun">천문령 전투</option><option value="gwiju">귀주대첩</option><option value="hansan">한산도 대첩</option></select></label></p><table><thead><tr><th>순위</th><th>반</th><th>이니셜</th><th>점수</th><th>최고 웨이브</th></tr></thead><tbody id="records"></tbody></table><p id="empty" hidden>표시할 기록이 없습니다. Google Sheets에 기록이 저장됐는지 확인하세요.</p><p style="font-size:13px;opacity:.8">학번·실명은 입력받지 않습니다. 공동 랭킹은 브라우저별 임시 ID를 사용합니다. 같은 학생의 다른 기기 기록은 별도로 등록될 수 있습니다.</p></main><script src="assets/hd-online-config.js"></script><script src="assets/hd-online.js"></script><script src="assets/hd-records.js"></script><script>async function show(){let st=document.getElementById('stage').value;let rows=HDRecords.list(st);let online=false;if(window.HDOnline?.isConfigured()){try{const r=await HDOnline.top(st);if(!r||!r.ok||!Array.isArray(r.rows))throw Error('bad response');rows=r.rows;online=true;}catch(err){document.getElementById('lbStatus').textContent='공동 랭킹 조회 실패. 이 기기의 시험 기록을 표시합니다.';}}document.getElementById('lbStatus').textContent=online?'공동 TOP 50 · 반과 이니셜만 공개됩니다. 온라인 점수는 인증된 기록이 아니므로 참고용입니다.':(window.HDOnline?.isConfigured()?'공동 랭킹 조회 실패 · 로컬 기록 표시':'구글시트 미연결 · 이 기기에 저장된 시험 기록만 표시');document.getElementById('records').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.cls}반</td><td>${HDRecords.safe(r.initial)}</td><td>${Number(r.score).toLocaleString()}</td><td>${r.wave}</td></tr>`).join('');document.getElementById('empty').hidden=rows.length>0;}document.getElementById('stage').addEventListener('change',show);document.getElementById('refreshRanks').onclick=show;show();</script></body></html>
