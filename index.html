<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>역사 디펜스 | 전투 지휘소 v2.8</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100b08;color:#f8e8ce;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ffdb8a;outline-offset:3px}
.wrap{min-height:100svh;display:grid;place-items:center;overflow:auto}.board{position:relative;width:min(100vw,177.68vh);aspect-ratio:1672/941;flex-shrink:0;background:#23170d url('assets/command_map_no_region_labels.png') center / 100% 100% no-repeat;box-shadow:0 0 40px #000}
.hot{position:absolute;z-index:3;border:0;background:none;cursor:pointer;transform:translate(-50%,-50%);border-radius:12px}.hot.selected:before{content:'';position:absolute;inset:10% 9%;border:2px solid #fff3aa;border-radius:12px;box-shadow:0 0 12px 4px #ffe286b0;pointer-events:none}.hot:hover:before,.hot:focus-visible:before{content:'';position:absolute;inset:0;border:2px solid #ffdf8d;border-radius:12px;pointer-events:none}
.hot[data-id="ansi"]{left:25.8%;top:30.2%;width:12.3%;height:12.4%}.hot[data-id="cheonmun"]{left:58.8%;top:31%;width:13.2%;height:12.8%}.hot[data-id="gwiju"]{left:40%;top:50%;width:10.5%;height:12.6%}.hot[data-id="hansan"]{left:61%;top:70%;width:12%;height:12%}
.tool{position:absolute;z-index:3;background:transparent;border:0;border-radius:8px}.tool:hover{box-shadow:inset 0 0 0 2px #ffde94}.tool.record{left:1.0%;top:88.1%;width:10%;height:7.1%}.tool.achieve{left:11%;top:88.1%;width:8.3%;height:7.1%}.tool.relic{left:19.7%;top:88.1%;width:10.1%;height:7.1%}.tool.help{left:90.2%;top:88.1%;width:8.5%;height:7.1%}
.side{position:absolute;z-index:5;left:73.95%;top:9.9%;width:24.5%;height:68.3%;background:#23160e;border:2px solid #b68a58;border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;padding:13px 14px;box-shadow:0 3px 12px #0008;overflow:hidden}
.preview{height:29%;min-height:0;flex-shrink:0;background:#28333e center/cover no-repeat;border:1px solid #b99261;border-radius:5px}.title{margin:8px 0 0;padding:6px 10px;background:linear-gradient(#b33729,#7c1f18);border:1px solid #d58a67;border-radius:5px;font-weight:900;font-size:clamp(12px,1.45vw,22px);white-space:nowrap}.desc{font-size:clamp(10px,.84vw,13px);line-height:1.48;margin:9px 0 8px;min-height:0}.stats{border-top:1px solid #866040;border-bottom:1px solid #866040;padding:7px 0;display:grid;grid-template-columns:71px 1fr;gap:7px 5px;font-size:clamp(10px,.82vw,13px);line-height:1.45}.stats span{color:#deb982;white-space:nowrap}.stats strong{color:#ffefdb;overflow-wrap:anywhere}.launch{margin-top:0;text-align:center;display:block;padding:10px 5px;border:2px solid #e0b47a;border-radius:7px;background:linear-gradient(#bf3929,#952117);text-decoration:none;color:#fff0d1;font-weight:900;font-size:clamp(12px,1.25vw,18px)}
.toast{position:absolute;z-index:12;left:50%;top:7%;transform:translateX(-50%);max-width:70%;display:none;padding:9px 15px;background:#21150ef2;border:1px solid #c29a65;border-radius:8px;text-align:center}.toast.show{display:block}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-aspect-ratio:9/10){.wrap{place-items:start;overflow-x:auto}.board{width:1100px;min-width:1100px}}

/* Bottom tool dialogs have their own stable center overlay rather than a misplaced toast. */
.overlay{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#070403b8}
.overlay.open{display:flex}
.dialog{position:relative;width:min(460px,78%);max-height:75%;overflow:auto;border:3px solid #cfa46a;border-radius:15px;padding:23px;background:linear-gradient(160deg,#392416,#160f0a);box-shadow:0 15px 55px #000}
.dialog h2{color:#ffe1a1;font-size:clamp(18px,2vw,27px);margin:0 0 12px}.dialog p{line-height:1.7;margin:0 0 20px;font-size:clamp(13px,1.2vw,17px)}
.dialog button{border:1px solid #ddb47c;border-radius:8px;background:#703d24;color:#fff1cf;padding:9px 22px;font-weight:800}
.tool:focus-visible{box-shadow:inset 0 0 0 3px #ffdc86}
</style></head><body><main class="wrap"><section class="board" aria-label="역사 디펜스 전투 지휘소"><h1 class="sr">역사 디펜스</h1>
<button class="hot" data-id="ansi" title="안시성 전투" aria-label="안시성 전투 선택"></button><button class="hot" data-id="cheonmun" title="천문령 전투" aria-label="천문령 전투 선택"></button><button class="hot" data-id="gwiju" title="귀주대첩" aria-label="귀주대첩 선택"></button><button class="hot" data-id="hansan" title="한산도 대첩" aria-label="한산도 대첩 선택"></button>
<button class="tool record" data-tool="record" aria-label="전투 기록"></button><button class="tool achieve" data-tool="achieve" aria-label="업적"></button><button class="tool relic" data-tool="relic" aria-label="유물 도감"></button><button class="tool help" data-tool="help" aria-label="이용 안내"></button>
<aside class="side" aria-live="polite"><div class="preview" id="preview" role="img"></div><div class="title" id="stageTitle"></div><p class="desc" id="stageDesc"></p><div class="stats" id="stats"></div><a class="launch" id="launch" href="#">⚔ 전장 입장 →</a></aside><div class="overlay" id="overlay" aria-hidden="true"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><p id="dialogText"></p><button type="button" id="dialogClose">닫기</button></section></div></section></main>
<script>
const stages={ansi:{name:'안시성 전투',image:'assets/preview_ansi.webp',desc:'당군의 공격에 맞서 고구려 안시성을 지키세요.',era:'고구려',where:'요동 지역',enemy:'당군',kind:'3개 성문 방어',url:'stages/ansi/index.html'},cheonmun:{name:'천문령 전투',image:'assets/preview_cheonmun.webp',desc:'대조영 세력과 유민을 보호하며 천문령을 돌파하세요.',era:'발해 건국 과정',where:'만주 동부 일대',enemy:'당군',kind:'유민 보호',url:'stages/cheonmun/index.html'},gwiju:{name:'귀주대첩',image:'assets/preview_gwiju.webp',desc:'강감찬이 지휘하는 고려군으로 거란군을 물리치세요.',era:'고려',where:'귀주 일대',enemy:'거란군',kind:'2개 전선 방어',url:'stages/gwiju/index.html'},hansan:{name:'한산도 대첩',image:'assets/preview_hansan.webp',desc:'조선 수군을 지휘하여 한산도 앞바다를 지키세요.',era:'조선',where:'한산도 해역',enemy:'일본 수군',kind:'해전 방어',url:'stages/hansan/battle/index.html'}};
const el=id=>document.getElementById(id);let timer,userPicked=false;function selectStage(id){const s=stages[id];if(!s)return;el('preview').style.backgroundImage=`url('${s.image}')`;el('preview').setAttribute('aria-label',s.name+' 전장 미리보기');el('stageTitle').textContent=s.name;el('stageDesc').textContent=s.desc;el('launch').href=s.url;el('stats').replaceChildren();for(const [key,value] of [['시대',s.era],['전투 위치',s.where],['주요 상대',s.enemy],['전투 유형',s.kind]]){let a=document.createElement('span'),b=document.createElement('strong');a.textContent=key;b.textContent=value;el('stats').append(a,b)}document.querySelectorAll('.hot').forEach(b=>{b.classList.toggle('selected',b.dataset.id===id && userPicked);b.setAttribute('aria-pressed',String(b.dataset.id===id && userPicked))})}
let focusedBeforeDialog=null;
function openTool(name){const entries={record:['전투 기록','전투 승리 기록 연동은 준비 중입니다. 현재 네 전투는 각각 플레이할 수 있습니다.'],achieve:['업적','업적 기능은 추후 전투 승리 결과와 연결됩니다.'],relic:['유물 도감','유물 도감 기능은 추후 추가될 예정입니다.'],help:['이용 안내','지도에서 전투 깃발을 선택하면 오른쪽 전투 정보가 바뀝니다. 전장 입장을 누르면 해당 전투로 이동합니다.']};const data=entries[name];if(!data)return;focusedBeforeDialog=document.activeElement;el('dialogTitle').textContent=data[0];el('dialogText').textContent=data[1];el('overlay').classList.add('open');el('overlay').setAttribute('aria-hidden','false');el('dialogClose').focus()}
function closeTool(){el('overlay').classList.remove('open');el('overlay').setAttribute('aria-hidden','true');focusedBeforeDialog?.focus()}
document.querySelectorAll('.hot').forEach(b=>b.addEventListener('click',()=>{userPicked=true;selectStage(b.dataset.id)}));
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>openTool(b.dataset.tool)));
el('dialogClose').addEventListener('click',closeTool);el('overlay').addEventListener('click',e=>{if(e.target===el('overlay'))closeTool()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&el('overlay').classList.contains('open'))closeTool()});
selectStage('ansi');
</script></body></html>
